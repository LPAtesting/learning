<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#E9E2D2;font-family:'Nunito',system-ui,-apple-system,sans-serif;color:#25272E;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:#2FA36B;text-decoration:none} a:hover{color:#1E7D4F}
  ::selection{background:#CBEBDC}
  .dc-btn{border:none;font-family:'Hanken Grotesk',sans-serif;transition:transform .07s ease, box-shadow .07s ease, filter .15s ease, background .15s ease}
  .dc-btn:not(:disabled){cursor:pointer}
  .dc-btn.dc-shadow:not(:disabled):active{transform:translateY(3px);box-shadow:none!important}
  .dc-opt{transition:background .12s,border-color .12s,box-shadow .1s,transform .06s;cursor:pointer}
  .dc-opt:hover{filter:brightness(.985)}
  .dc-opt:active{transform:translateY(1px)}
  .dc-chip{transition:transform .07s ease,filter .12s,box-shadow .07s;cursor:pointer}
  .dc-chip:not(:disabled):active{transform:translateY(2px);box-shadow:none!important}
  .dc-node{transition:transform .09s ease}
  .dc-node:not(:disabled):active{transform:translateY(3px)}
  .dc-link{cursor:pointer;transition:color .12s,opacity .12s}
  .dc-link:hover{opacity:.72}
  .dc-row{transition:background .12s}
  .dc-row:hover{background:#FAF7EF}
  .dc-scroll::-webkit-scrollbar{width:11px}
  .dc-scroll::-webkit-scrollbar-track{background:transparent}
  .dc-scroll::-webkit-scrollbar-thumb{background:#DAD3C2;border-radius:9px;border:3px solid #FBF8F1}
  .dc-scroll:hover::-webkit-scrollbar-thumb{background:#CDC5B1}
  @keyframes dc-pop{0%{transform:scale(.7);opacity:0}55%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
  @keyframes dc-up{0%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}
  @keyframes dc-shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}36%{transform:translateX(7px)}54%{transform:translateX(-5px)}72%{transform:translateX(5px)}88%{transform:translateX(-2px)}}
  @keyframes dc-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes dc-spin{to{transform:rotate(360deg)}}
  @keyframes dc-ring{0%{box-shadow:0 0 0 0 rgba(47,163,107,.42)}70%{box-shadow:0 0 0 14px rgba(47,163,107,0)}100%{box-shadow:0 0 0 0 rgba(47,163,107,0)}}
  html,body{overscroll-behavior:none}
  button{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  @keyframes dc-pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.45);opacity:0}}
  @keyframes dc-fall{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(110vh) rotate(680deg)}}
  @keyframes dc-fade{from{opacity:0}to{opacity:1}}
</style>

function rich(s,k){ s=String(s==null?"":s); k=k||"r"; const out=[]; let i=0, buf="", n=0;
  const push=()=>{ if(buf){ out.push(buf); buf=""; } };
  while(i<s.length){
    if(s[i]==="*" && s[i+1]==="*"){ let j=s.indexOf("**",i+2); while(j>=0 && s[j+2]==="*") j++;
      if(j>i+2){ push(); out.push(h("b",{key:k+"b"+(n++),style:{fontWeight:800}}, rich(s.slice(i+2,j),k+n))); i=j+2; continue; } }
    if(s[i]==="*" && s[i+1] && s[i+1]!==" " && s[i+1]!=="*"){ const j=s.indexOf("*",i+1);
      if(j>i+1){ push(); out.push(h("i",{key:k+"i"+(n++)}, s.slice(i+1,j))); i=j+1; continue; } }
    buf+=s[i]; i++; }
  push(); return out; }

  // Part B diagrams (flow, timeline, tree, compare, ladder). Shown after answering, since many of them contain the answer.
  renderPBDiagram(d, ac){
    if(!d||typeof d!=="object") return null;
    const it=x=>typeof x==="string"?{t:x}:(x||{});
    const txt=(x,col)=>{ x=it(x); return h("div",{style:{minWidth:0}},
      h("div",{style:{fontFamily:HEAD,fontWeight:700,fontSize:13.5,color:col||C.ink,lineHeight:1.3}}, x.t),
      x.d ? h("div",{style:{fontSize:12.5,color:C.ink2,marginTop:2,lineHeight:1.45}}, x.d) : null); };
    const box=(x,hi)=>h("div",{style:{background:hi?ac.tint:"#F5F0E3",border:"1.5px solid "+(hi?ac.color:C.line2),borderRadius:10,padding:"9px 11px",minWidth:0}}, txt(x,hi?ac.dark:null));
    let body=null;
    if(d.k==="flow"||d.k==="timeline"){
      const a=(d.k==="flow"?d.steps:d.points)||[], fl=d.k==="flow";
      body=h("div",null, a.map((s,i)=>h("div",{key:i,style:{display:"flex",gap:11}},
        h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",width:24,flexShrink:0}},
          fl ? h("div",{style:{width:24,height:24,borderRadius:"50%",background:ac.color,color:"#fff",fontFamily:HEAD,fontWeight:800,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}, String(i+1))
             : h("div",{style:{width:14,height:14,borderRadius:"50%",border:"3px solid "+ac.color,background:C.card,marginTop:3,flexShrink:0}}),
          i<a.length-1 ? h("div",{style:{flex:1,width:2,minHeight:8,background:fl?ac.tint:C.line2,marginTop:3}}) : null),
        h("div",{style:{flex:1,minWidth:0,paddingTop:fl?3:0,paddingBottom:i<a.length-1?13:0}}, txt(s)))));
    } else if(d.k==="tree"){
      const ns=d.nodes||[];
      body=h("div",null,
        h("div",{style:{display:"flex",justifyContent:"center"}},
          h("div",{style:{background:ac.tint,border:"1.5px solid "+ac.color,borderRadius:10,padding:"8px 14px",fontFamily:HEAD,fontWeight:800,fontSize:13.5,color:ac.dark,textAlign:"center",maxWidth:"100%"}}, d.root)),
        h("div",{style:{width:2,height:12,background:C.line2,margin:"0 auto"}}),
        h("div",{style:{borderTop:"2px solid "+C.line2,paddingTop:12,display:"grid",gridTemplateColumns:ns.length>1?"repeat(2,minmax(0,1fr))":"minmax(0,1fr)",gap:8}},
          ns.map((x,i)=>h("div",{key:i,style:{minWidth:0}}, box(x)))));
    } else if(d.k==="compare"){
      const cols=d.cols||[];
      body=h("div",{style:{display:"grid",gridTemplateColumns:"repeat("+Math.max(1,cols.length)+",minmax(0,1fr))",gap:8}},
        cols.map((c,i)=>h("div",{key:i,style:{background:i?"#F5F0E3":ac.tint,border:"1.5px solid "+(i?C.line2:ac.color),borderRadius:10,padding:"10px 11px",minWidth:0}},
          h("div",{style:{fontFamily:HEAD,fontWeight:800,fontSize:13,color:i?C.ink:ac.dark,lineHeight:1.25,marginBottom:7}}, c.h),
          (c.items||[]).map((x,j)=>h("div",{key:j,style:{display:"flex",gap:7,fontSize:12.5,color:C.ink,lineHeight:1.4,marginTop:j?5:0}},
            h("span",{style:{width:5,height:5,borderRadius:3,background:i?C.ink3:ac.color,flexShrink:0,marginTop:7}}),
            h("span",{style:{minWidth:0}}, it(x).t))))));
    } else if(d.k==="ladder"){
      const rs=d.rungs||[];
      body=h("div",{style:{display:"flex",gap:10}},
        h("div",{style:{width:4,flexShrink:0,borderRadius:2,background:d.topHeavy===false?"linear-gradient("+C.line2+","+ac.color+")":"linear-gradient("+ac.color+","+C.line2+")"}}),
        h("div",{style:{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:6}},
          rs.map((x,i)=>h("div",{key:i}, box(x, d.topHeavy!==false && i===0)))));
    } else return null;
    return h("div",{style:{border:"1px solid "+C.line,background:C.card,borderRadius:14,padding:"14px 16px",marginTop:4,marginBottom:8}},
      h("div",{style:{fontSize:10.5,fontWeight:800,letterSpacing:1,color:C.ink3,marginBottom:6}},"DIAGRAM"),
      d.title ? h("div",{style:{fontFamily:HEAD,fontWeight:700,fontSize:14.5,color:C.ink,lineHeight:1.3,marginBottom:12,textWrap:"pretty"}}, d.title) : null,
      body,
      d.note ? h("div",{style:{fontSize:12,color:C.ink2,marginTop:10,lineHeight:1.45}}, d.note) : null);

  renderInteraction(q,ac){
    if(q.type==="mcq"||q.type==="tf"||q.type==="scenario") return this.renderChoices(q,ac);
    if(q.type==="fill") return this.renderFill(q,ac);
    if(q.type==="match") return this.state.mode==="exam" ? this.renderMatchExam(q,ac) : this.renderMatchLesson(q,ac);
    if(q.type==="order") return this.renderOrder(q,ac);
    return null;
  }
  renderChoices(q,ac){
    const checked=this.state.phase==="checked";
    const isTF=q.type==="tf";
    return h("div",{style:{display:"flex",flexDirection:"column",gap:11}},
      q.options.map((o,i)=>{
        const sel=this.state.pick===i;
        let bd=C.line2, bg=C.card, fg=C.ink, sh="0 2px 0 "+C.line2;
        let badge=null;
        if(!checked){
          if(sel){ bd=ac.color; bg=ac.tint; sh="0 2px 0 "+ac.color; }
        } else {
          if(o.correct){ bd=C.green; bg=C.greenT; sh="0 2px 0 "+C.green; badge=icon("check",18,"#fff",2.6); }
          else if(sel){ bd=C.red; bg=C.redT; sh="0 2px 0 "+C.red; badge=icon("x",18,"#fff",2.6); }
          else { bd=C.line2; bg=C.card; fg=C.ink2; }
        }
        const bubbleBg = badge ? (o.correct?C.green:C.red) : (sel&&!checked? ac.color : "transparent");
        const bubbleBd = (sel&&!checked)? ac.color : (badge? "transparent" : C.line2);
        const bubbleFg = (sel&&!checked)? "#fff" : C.ink2;
        return h("button",{key:i,className:"dc-opt dc-btn",disabled:checked,onClick:()=>{ if(this.state.pick!==i) AU.play("select"); this.setState({pick:i}); },
          style:{textAlign:"left",display:"flex",alignItems:"center",gap:13,background:bg,border:"2px solid "+bd,boxShadow:checked?"none":sh,
            borderRadius:15,padding:"14px 15px",width:"100%",fontFamily:"'Nunito',sans-serif",color:fg,cursor:checked?"default":"pointer"}},
          h("div",{style:{width:30,height:30,borderRadius:"50%",flexShrink:0,border:"2px solid "+bubbleBd,background:bubbleBg,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Hanken Grotesk',sans-serif",fontWeight:700,fontSize:14,color:bubbleFg}},
            badge? badge : (isTF? null : String.fromCharCode(65+i))),
          h("span",{style:{fontSize:15.5,lineHeight:1.45,fontWeight: isTF?700:600}}, o.t)
        );
      })
    );
  }

  renderFill(q,ac){
    const checked=this.state.phase==="checked";
    const correct=checked && matchFill(this.state.val,q.accept);
    return h("div",null,
      h("input",{type:"text",value:this.state.val,disabled:checked,autoFocus:true,
        onChange:e=>this.setState({val:e.target.value}),
        onKeyDown:e=>{ if(e.key==="Enter"&&this.state.val.trim()&&!checked) this.check(); },
        placeholder:"Type your answer…",
        style:{width:"100%",fontFamily:"'Nunito',sans-serif",fontSize:17,fontWeight:700,color:C.ink,
          padding:"15px 16px",borderRadius:14,outline:"none",background:C.card,
          border:"2px solid "+(checked?(correct?C.green:C.red):C.line2),
          boxShadow: checked?"none":("0 2px 0 "+C.line2)}}),
      checked ? h("div",{style:{marginTop:12,padding:"12px 15px",borderRadius:13,background:correct?C.greenT:C.redT,border:"1.5px solid "+(correct?C.green:C.red)}},
        h("div",{style:{fontSize:12,fontWeight:800,letterSpacing:.5,color:correct?C.greenD:C.redD,marginBottom:3}}, correct?"CORRECT":"ANSWER"),
        h("div",{style:{fontSize:16,fontWeight:800,color:C.ink,fontFamily:"'Hanken Grotesk',sans-serif"}}, q.answer)
      ) : null
    );
  }


  renderMatchLesson(q,ac){
    const checked=this.state.phase==="checked";
    const cell=(text,state,onClick,key)=>{
      let bd=C.line2,bg=C.card,fg=C.ink,anim="none";
      if(state==="matched"){ bd=C.green; bg=C.greenT; fg=C.greenD; }
      else if(state==="sel"){ bd=ac.color; bg=ac.tint; }
      else if(state==="wrong"){ bd=C.red; bg=C.redT; anim="dc-shake .45s"; }
      return h("button",{key:key,className:"dc-opt dc-btn",disabled:checked||state==="matched",onClick,
        style:{width:"100%",textAlign:"left",background:bg,border:"2px solid "+bd,borderRadius:13,padding:"12px 13px",
          fontFamily:"'Nunito',sans-serif",fontSize:14,fontWeight:700,color:fg,lineHeight:1.35,
          display:"flex",alignItems:"center",gap:8,animation:anim,boxShadow: (checked||state==="matched")?"none":("0 2px 0 "+C.line2)}},
        state==="matched"? icon("check",16,C.green,2.6):null,
        h("span",null,text));
    };
    const leftCol=q.pairs.map((pr,li)=>{
      let st="idle";
      if(this.state.matched[li]) st="matched";
      else if(this.state.sel===li) st="sel";
      else if(this.state.mwrong&&this.state.mwrong.l===li) st="wrong";
      return cell(pr.l, st, ()=>this.tapLeft(li), "L"+li);
    });
    const rightCol=this.state.shR.map((r,ri)=>{
      let st="idle";
      if((this.state.mr||{})[r.li]) st="matched";
      else if(this.state.mwrong&&this.state.mwrong.r===r.li) st="wrong";
      return cell(r.text, st, ()=>this.tapRight(r.li), "R"+r.li);
    });
    return h("div",null,
      h("div",{style:{fontSize:13,color:C.ink2,marginBottom:11,fontWeight:700}}, "Tap a term, then its match."),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
        h("div",{style:{display:"flex",flexDirection:"column",gap:9}}, leftCol),
        h("div",{style:{display:"flex",flexDirection:"column",gap:9}}, rightCol))
    );
  }


  renderMatchExam(q,ac){
    const s=this.state, pairs=s.pairs, rev={}, num={};
    Object.keys(pairs).forEach(k=>{ rev[pairs[k]]=+k; });
    Object.keys(pairs).map(Number).sort((a,b)=>a-b).forEach((k,i)=>{ num[k]=i+1; });
    const cell=(text,state,n,onClick,key)=>h("button",{key,className:"dc-opt dc-btn",onClick,
      style:{width:"100%",textAlign:"left",background:state==="sel"?ac.tint:C.card,border:"2px solid "+(state==="idle"?C.line2:ac.color),borderRadius:13,padding:"12px 13px",
        fontFamily:BODY,fontSize:14,fontWeight:700,color:C.ink,lineHeight:1.35,display:"flex",alignItems:"center",gap:8,boxShadow:"0 2px 0 "+(state==="idle"?C.line2:ac.color)}},
      n ? h("span",{style:{width:22,height:22,borderRadius:"50%",background:ac.color,color:"#fff",fontFamily:HEAD,fontWeight:800,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}, String(n)) : null,
      h("span",null,text));
    const L=q.pairs.map((p,li)=>cell(p.l, s.sel===li?"sel":(pairs[li]!=null?"paired":"idle"), pairs[li]!=null?num[li]:null, ()=>this.tapLeft(li), "L"+li));
    const R=s.shR.map(r=>cell(r.text, rev[r.li]!=null?"paired":"idle", rev[r.li]!=null?num[rev[r.li]]:null, ()=>this.tapRight(r.li), "R"+r.li));
    return h("div",null,
      h("div",{style:{fontSize:13,color:C.ink2,marginBottom:11,fontWeight:700}}, "Tap a term, then its match. Tap a paired term to change it."),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
        h("div",{style:{display:"flex",flexDirection:"column",gap:9}}, L),
        h("div",{style:{display:"flex",flexDirection:"column",gap:9}}, R)));
  }
  renderOrder(q,ac){
    const checked=this.state.phase==="checked";
    const slots=[];
    for(let i=0;i<q.steps.length;i++){
      const has=i<this.state.chosen.length;
      const idx=this.state.chosen[i];
      let bd=C.line2,bg="#F4EFE2",fg=C.ink;
      if(checked && has){ const ok=idx===i; bd=ok?C.green:C.red; bg=ok?C.greenT:C.redT; }
      else if(has){ bd=ac.color; bg=C.card; }
      slots.push(h("button",{key:"s"+i,className:"dc-opt dc-btn",disabled:!has||checked,onClick:()=>this.removeSlot(i),
        style:{width:"100%",textAlign:"left",display:"flex",alignItems:"center",gap:10,background:bg,border:"2px "+(has?"solid":"dashed")+" "+bd,
          borderRadius:13,padding:"12px 13px",minHeight:48,fontFamily:"'Nunito',sans-serif",fontSize:14,fontWeight:700,color:fg,lineHeight:1.35}},
        h("div",{style:{width:24,height:24,borderRadius:"50%",flexShrink:0,background:has?ac.color:"#E2DBC9",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Hanken Grotesk',sans-serif",fontWeight:700,fontSize:13}}, i+1),
        h("span",null, has? q.steps[idx] : h("span",{style:{color:C.ink3,fontWeight:600}},"—"))
      ));
    }
    const pool=this.state.shChips.filter(c=>!this.state.chosen.includes(c.idx)).map(c=>
      h("button",{key:"c"+c.idx,className:"dc-chip dc-btn",disabled:checked,onClick:()=>this.addChip(c.idx),
        style:{textAlign:"left",background:C.card,border:"2px solid "+ac.color,color:C.ink,borderRadius:12,padding:"10px 13px",
          fontFamily:"'Nunito',sans-serif",fontSize:13.5,fontWeight:700,lineHeight:1.3,boxShadow:"0 3px 0 "+ac.tint}}, c.text));
    return h("div",null,
      h("div",{style:{fontSize:13,color:C.ink2,marginBottom:11,fontWeight:700}}, "Tap the steps in the correct order."),
      h("div",{style:{display:"flex",flexDirection:"column",gap:9,marginBottom:14}}, slots),
      pool.length? h("div",{style:{display:"flex",flexWrap:"wrap",gap:9,paddingTop:4,borderTop:"1px dashed "+C.line2}}, pool):null
    );
  }


  renderExplain(q,ac,pick,correctArg,inReview){
    const rows=[];

      q.options.forEach((o,i)=>{
        const sel=pick===i;

        rows.push(h("div",{key:i,style:{background:bg,borderLeft:"3px solid "+col,borderRadius:"0 10px 10px 0",padding:"10px 13px",marginBottom:8}},

            h("span",{style:{width:18,height:18,borderRadius:"50%",background:col,display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}, icon(o.correct?"check":"x",12,"#fff",3)),
            h("span",{style:{fontWeight:800,fontSize:13,color:col}}, o.correct?"Correct":(sel?"Your answer":"Incorrect")),
            h("span",{style:{fontSize:13,color:C.ink2,fontWeight:700}}, "· "+o.t)),
          h("div",{style:{fontSize:13.5,color:C.ink,lineHeight:1.55,paddingLeft:25,whiteSpace:"pre-line"}}, o.why)
        ));
      });
      if(q.why) rows.push(h("div",{key:"exp",style:{background:C.card,border:"1px solid "+C.line,borderRadius:12,padding:"12px 14px",marginTop:4,marginBottom:8}},
        h("div",{style:{fontSize:10.5,fontWeight:800,letterSpacing:1,color:C.ink3,marginBottom:6}},"EXPLANATION"),
        h("div",{style:{fontSize:14,color:C.ink,lineHeight:1.6,whiteSpace:"pre-line",textWrap:"pretty"}}, q.why)));
    } else if(q.why){
      const correct=correctArg;
      rows.push(h("div",{key:"w",style:{background:correct?"#F1FAF5":"#FAF8F1",borderLeft:"3px solid "+(correct?C.green:ac.color),borderRadius:"0 10px 10px 0",padding:"11px 14px",marginBottom:8}},

  correctText(q){
    if(q.options){ const o=q.options.find(o=>o.correct); return o?o.t:""; }
    if(q.type==="fill") return q.answer||(q.accept||[])[0]||"";
    if(q.type==="order") return (q.steps||[]).map((x,i)=>(i+1)+". "+x).join("\n");
    if(q.type==="match") return (q.pairs||[]).map(p=>p.l+" → "+p.r).join("\n");
    return "";
  }
  answerText(q,a){
    if(q.options) return (a.pick!=null && q.options[a.pick]) ? q.options[a.pick].t : "No answer";
    if(q.type==="fill") return a.val||"No answer";
    if(q.type==="order") return (a.chosen&&a.chosen.length) ? a.chosen.map((c,i)=>(i+1)+". "+q.steps[c]).join("\n") : "No answer";
    if(q.type==="match"){ if(a.mfirst) return "Paired “"+a.mfirst.l+"” with “"+a.mfirst.r+"”";
      const bad=q.pairs.map((p,i)=>{ const r=(a.pairs||{})[i]; return (r!=null&&(r===i||q.pairs[r].r===p.r)) ? null : p.l+" → "+(r!=null?q.pairs[r].r:"not matched"); }).filter(Boolean);
      return bad.length ? bad.join("\n") : "Mismatched pairs"; }
    return "";

      items[q.id]=Object.assign({}, p, {l:q.lesson, n:(p.n||0)+1, run:0, rd:null, t:now, a:[{t:now,x:clip(x,400)}].concat(p.a||[]).slice(0,3), p:clip(q.prompt,300), c:clip(this.correctText(q),400)});

      h("div",{style:{fontSize:10.5,fontWeight:800,letterSpacing:1,color:C.goldD,marginBottom:5}},"YOUR HISTORY WITH THIS QUESTION"),
      last ? h("div",{style:{fontSize:13.5,color:C.ink,lineHeight:1.5,whiteSpace:"pre-line"}}, "On "+fmtD(new Date(last.t))+" you answered: ", h("b",null,"“"+last.x+"”")) : null,
      h("div",{style:{fontSize:12.5,color:C.ink2,marginTop:5,fontWeight:700,lineHeight:1.45}}, "Missed "+it.n+"× · "+msg));
  }
  ansBox(lab,txt,ok,key){ return h("div",{key:key||lab,style:{padding:"9px 12px",borderRadius:11,background:ok?C.greenT:C.redT,marginBottom:7}},
    h("div",{style:{fontSize:10.5,fontWeight:800,letterSpacing:.6,color:ok?C.greenD:C.redD,marginBottom:3}},lab),
    h("div",{style:{fontSize:13.5,fontWeight:700,color:C.ink,lineHeight:1.45,whiteSpace:"pre-line"}},txt)); }
  sheetEl(key,title,sub,kids){
    return this.sheetWrap(key, ()=>this.setState({sheet:null,hideFor:null}), [
        h("div",{key:"gr",style:{width:40,height:5,borderRadius:3,background:C.line2,margin:"0 auto 14px"}}),
        h("div",{key:"t",style:{fontFamily:HEAD,fontWeight:800,fontSize:19,color:C.ink}},title),
        sub ? h("div",{key:"s",style:{fontSize:13.5,color:C.ink2,marginTop:4,marginBottom:10,lineHeight:1.5,textWrap:"pretty"}},sub) : null,
        h("div",{key:"k"}, kids)], {padding:"14px 18px 16px",paddingBottom:"calc(16px + env(safe-area-inset-bottom))",overflowY:"auto"});
  }
  renderHideSheet(){
    const id=this.state.hideFor;
    const rows=HIDE_WHY.map(w=>h("button",{key:w,className:"dc-btn dc-row",onClick:()=>this.hideQuestion(id,w),
      style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,width:"100%",textAlign:"left",background:"transparent",border:"none",borderTop:"1px solid "+C.line,padding:"13px 4px",minHeight:52,fontFamily:BODY,fontSize:15,fontWeight:700,color:C.ink}}, w, icon("chevron",16,C.ink3,2)));
    return this.sheetEl("hide","Hide this question?","It stops appearing in lessons, daily sessions, reviews and exams. It stays in your export with the reason, so you can report it. You can restore it from the mistake log.",
      [h("div",{key:"l",style:{fontSize:11.5,fontWeight:800,letterSpacing:.8,color:C.ink3,margin:"8px 0 4px"}},"WHAT'S WRONG WITH IT?")].concat(rows,
       [h("div",{key:"c",style:{marginTop:12}}, this.btn("Cancel", ()=>this.setState({hideFor:null}), {full:true,bg:C.card,color:C.ink2,dark:C.line2,border:C.line2}))]));
  }
  renderExportSheet(n){
    const opt=(k,ic,t,sub,fn)=>h("button",{key:k,className:"dc-btn dc-row",onClick:fn,
      style:{display:"flex",alignItems:"center",gap:13,width:"100%",textAlign:"left",background:"transparent",border:"none",borderTop:"1px solid "+C.line,padding:"13px 4px",fontFamily:BODY,minHeight:64}},
      h("div",{style:{width:40,height:40,borderRadius:12,background:"#F1ECE0",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}, icon(ic,20,C.ink2,2.2)),
      h("div",{style:{flex:1,minWidth:0}}, h("div",{style:{fontFamily:HEAD,fontWeight:700,fontSize:15,color:C.ink}},t), h("div",{style:{fontSize:12.5,color:C.ink3,marginTop:2,lineHeight:1.45}},sub)),
      icon("download",17,C.ink3,2.2));
    return this.sheetEl("export","Export mistake log", n+(n===1?" question":" questions")+", fixed and to fix, plus any you hid.", [
      opt("html","book","Document (.html)","Grouped by chapter, with your answers, the correct answers and explanations. Opens in any browser; print it to PDF.",()=>this.exportMistakes("html")),
      opt("csv","layers","Spreadsheet (.csv)","One row per question, for Excel or Google Sheets.",()=>this.exportMistakes("csv")),
      opt("txt","cards","Copy as text","Questions, your answers and the correct answers, to paste anywhere.",()=>this.exportMistakes("txt"))]);
  }
  // ---------- mistake log: screen ----------
  renderMistakes(){
    const s=this.state, list=this.mistList(), toFix=list.filter(x=>!x.fixed), fixedL=list.filter(x=>x.fixed), hid=s.mist.hidden, hidIds=Object.keys(hid).sort((a,b)=>hid[b].t-hid[a].t);
    const trs=TRACKS.filter(t=>list.some(x=>x.lm&&x.lm.tr.id===t.id)), mtr=trs.some(t=>t.id===s.mtr)?s.mtr:"all";
    const shown=(s.mf==="fix"?toFix:(s.mf==="fixed"?fixedL:list)).filter(x=>mtr==="all"||(x.lm&&x.lm.tr.id===mtr)).sort((a,b)=>(b.it.t||0)-(a.it.t||0));
    const groups={}, gorder=[];
    shown.forEach(x=>{ const k=x.lm?x.lm.u.id:"_"; if(!groups[k]){ groups[k]={u:x.lm?x.lm.u:null, items:[]}; gorder.push(k); } groups[k].items.push(x); });
    let budget=s.mLimit; const body=[];
    gorder.forEach(k=>{ if(budget<=0) return; const g=groups[k], items=g.items.slice(0,budget); budget-=items.length; body.push(this.mistGroup(g,items)); });
    const ids=toFix.filter(x=>x.q).sort((a,b)=>((b.it.n||0)-(a.it.n||0))||((a.it.t||0)-(b.it.t||0))).map(x=>x.id);
    const top=h("div",{key:"t",style:{flexShrink:0,paddingTop:"env(safe-area-inset-top)",background:C.paper,borderBottom:"1px solid "+C.line,position:"relative",zIndex:5}},
      h("div",{style:{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",minHeight:60}},
        h("button",{className:"dc-btn","aria-label":"Back",onClick:()=>this.goHome(),style:{background:"none",border:"none",padding:8,margin:-8,display:"flex",transform:"rotate(180deg)"}}, icon("chevron",24,C.ink2,2.4)),
        h("div",{style:{flex:1,fontFamily:HEAD,fontWeight:800,fontSize:21,color:C.ink,letterSpacing:-.3}},"Mistake log"),
        h("button",{className:"dc-btn dc-chip",onClick:()=>{ AU.play("tap"); this.setState({sheet:"export"}); },
          style:{display:"flex",alignItems:"center",gap:6,padding:"9px 13px",minHeight:44,borderRadius:12,border:"2px solid "+C.line2,background:C.card,fontFamily:HEAD,fontWeight:800,fontSize:13.5,color:C.ink2,boxShadow:"0 2px 0 "+C.line2}}, icon("download",16,C.ink2,2.4), "Export")));
    const seg=(id,lab,n)=>{ const on=s.mf===id; return h("button",{key:id,className:"dc-btn dc-chip",onClick:()=>{ AU.play("select"); this.setState({mf:id,mOpen:null,mLimit:40}); },
      style:{padding:"9px 4px",borderRadius:12,border:"2px solid "+(on?C.green:C.line2),background:on?C.greenT:C.card,color:on?C.greenD:C.ink2,fontFamily:HEAD,fontWeight:800,fontSize:13.5,boxShadow:"0 2px 0 "+(on?C.green:C.line2),minHeight:44}}, lab+" · "+n); };
    const chip=(id,lab)=>{ const on=mtr===id; return h("button",{key:id,className:"dc-btn dc-chip",onClick:()=>{ AU.play("select"); this.setState({mtr:id,mOpen:null,mLimit:40}); },
      style:{padding:"7px 12px",borderRadius:999,border:"1.5px solid "+(on?C.ink:C.line2),background:on?C.ink:"transparent",color:on?"#fff":C.ink2,fontFamily:HEAD,fontWeight:700,fontSize:13,minHeight:36}}, lab); };
    const empty= s.mf==="fix" ? (list.length ? "Nothing left to fix. Every question you missed has been answered correctly on two later days." : "No mistakes yet. Any question you get wrong, in a lesson, daily session, review or exam, is saved here.") : "Nothing here yet.";
    const hidCard= hidIds.length ? h("div",{key:"hid",style:{marginTop:8}}, this.card("Hidden questions", hidIds.map((id,i)=>{ const hd=hid[id], q=this.BYID[id], lm=LMETA[(q&&q.lesson)||hd.l];
      return h("div",{key:id,style:{display:"flex",gap:10,alignItems:"center",padding:"10px 0",borderTop:i?"1px solid "+C.line:"none"}},
        h("div",{style:{flex:1,minWidth:0}},
          h("div",{style:{fontSize:10.5,fontWeight:800,color:C.ink3,letterSpacing:.6,textTransform:"uppercase"}}, (lm?lm.l.code+" · ":"")+hd.why),
          h("div",{style:{fontSize:13.5,fontWeight:700,color:C.ink,lineHeight:1.4,marginTop:2,display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}, q?q.prompt:hd.p)),
        h("button",{className:"dc-btn dc-link",onClick:()=>this.restoreQuestion(id),style:{background:"none",border:"none",padding:"10px 4px",minHeight:44,color:C.greenD,fontFamily:HEAD,fontSize:13.5,fontWeight:800,flexShrink:0}},"Restore")); }), hidIds.length+" · not shown in any session")) : null;
    const content=h("div",{key:"b",className:"dc-scroll",ref:el=>{ this._ms=el; },style:{flex:1,overflowY:"auto",overflowX:"hidden",WebkitOverflowScrolling:"touch"}},
      h("div",{style:{padding:"18px 16px 36px",display:"flex",flexDirection:"column",gap:12}},
        h("div",{key:"sum",style:{display:"flex",gap:9}}, this.stat(String(toFix.length),"TO FIX",toFix.length?C.redD:C.ink), this.stat(String(fixedL.length),"FIXED",C.greenD), this.stat(String(list.reduce((n,x)=>n+(x.it.n||0),0)),"TOTAL MISSES",C.ink)),
        h("div",{key:"in",style:{fontSize:13,color:C.ink2,lineHeight:1.55,textWrap:"pretty"}}, "Every wrong answer is saved here for good, including after a progress reset. A question counts as fixed once you answer it correctly on two later days."),
        h("div",{key:"act",style:{display:"flex",flexDirection:"column",gap:10}},
          this.btn(ids.length?"Practise "+Math.min(20,ids.length)+" to fix":"Nothing to practise", ()=>this.startMistakes(ids), {full:true,bg:C.gold,dark:C.goldD,disabled:!ids.length,icon:icon("play",15,"#fff",2,true)}),
          s.due>0 ? this.btn("Review "+s.due+" due today", ()=>this.startReview(), {full:true,bg:C.card,color:C.goldD,dark:C.line2,border:C.line2,icon:icon("cards",18,C.goldD,2)}) : null),
        h("div",{key:"seg",style:{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:8,marginTop:6}}, seg("fix","To fix",toFix.length), seg("fixed","Fixed",fixedL.length), seg("all","All",list.length)),
        trs.length>1 ? h("div",{key:"trs",style:{display:"flex",flexWrap:"wrap",gap:7}}, [chip("all","All tracks")].concat(trs.map(t=>chip(t.id,t.name)))) : null,
        body.length ? body : h("div",{key:"em",style:{background:C.card,border:"1px solid "+C.line2,borderRadius:16,padding:"18px 16px",fontSize:14,color:C.ink2,lineHeight:1.55,textAlign:"center"}}, empty),
        shown.length>s.mLimit ? this.btn("Show more · "+(shown.length-s.mLimit)+" left", ()=>this.setState({mLimit:s.mLimit+40}), {full:true,bg:C.card,color:C.ink2,dark:C.line2,border:C.line2}) : null,
        hidCard,
        list.length ? h("div",{key:"clr",style:{textAlign:"center",marginTop:4}}, h("button",{className:"dc-btn dc-link",onClick:()=>this.clearMist(),style:{background:"none",border:"none",padding:"10px",color:C.ink3,fontSize:12.5,fontWeight:700,textDecoration:"underline",fontFamily:BODY}},"Clear mistake log")) : null));
    return this.frame([top, content, s.sheet==="export" ? this.renderExportSheet(Object.keys(s.mist.items).length+hidIds.filter(id=>!s.mist.items[id]).length) : null, s.hideFor ? this.renderHideSheet() : null]);
  }
  mistGroup(g,items){
    const u=g.u, k=u?u.id:"_", fixIds=g.items.filter(x=>!x.fixed&&x.q).map(x=>x.id);
    return h("div",{key:"g"+k,style:{marginTop:6}},
      h("div",{style:{display:"flex",alignItems:"flex-end",gap:10,margin:"0 2px 8px"}},
        h("div",{style:{flex:1,minWidth:0}},
          h("div",{style:{fontSize:10.5,fontWeight:800,letterSpacing:.7,color:u?u.dark:C.ink3,textTransform:"uppercase"}}, u ? u.part.t+" · "+this.kicker(u) : "Other"),
          h("div",{style:{fontFamily:HEAD,fontWeight:700,fontSize:15,color:C.ink,lineHeight:1.25,marginTop:1}}, u ? u.title : "No longer in the question bank")),
        fixIds.length ? h("button",{className:"dc-btn dc-chip",onClick:()=>this.startMistakes(fixIds),
          style:{flexShrink:0,display:"flex",alignItems:"center",gap:5,padding:"8px 11px",minHeight:38,borderRadius:11,border:"2px solid "+C.line2,background:C.card,color:C.goldD,fontFamily:HEAD,fontWeight:800,fontSize:12.5,boxShadow:"0 2px 0 "+C.line2}},
          icon("play",11,C.goldD,2,true), "Practise "+Math.min(20,fixIds.length)) : null),
      h("div",{style:{background:C.card,border:"1px solid "+C.line2,borderRadius:16,overflow:"hidden"}}, items.map((x,i)=>this.mistRow(x,i))));
  }
  mistRow(x,i){
    const s=this.state, open=s.mOpen===x.id, it=x.it, q=x.q, u=x.lm&&x.lm.u, ac=u?{color:u.color,dark:u.dark,tint:u.tint}:{color:C.gold,dark:C.goldD,tint:C.goldT};
    const meta= x.fixed ? "Fixed · missed "+it.n+"× in total" : "Last missed "+fmtD(new Date(it.t))+((it.run||0)>0?" · 1 of 2 clean answers":"");
    const clamp=open?{}:{display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"};
    const head=h("button",{className:"dc-btn dc-row",onClick:()=>{ AU.play("tap"); this.setState({mOpen:open?null:x.id}); },"aria-expanded":open,
      style:{display:"flex",alignItems:"flex-start",gap:11,width:"100%",textAlign:"left",background:"transparent",border:"none",padding:"12px 14px",fontFamily:BODY}},
      h("div",{style:{minWidth:32,height:24,padding:"0 7px",borderRadius:12,background:x.fixed?C.greenT:C.redT,color:x.fixed?C.greenD:C.redD,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1,fontFamily:HEAD,fontWeight:800,fontSize:12.5}},
        x.fixed ? icon("check",13,C.green,3) : it.n+"×"),
      h("div",{style:{flex:1,minWidth:0}},
        x.lm ? h("div",{style:{fontSize:10.5,fontWeight:800,color:C.ink3,letterSpacing:.6,textTransform:"uppercase"}}, x.lm.l.code+" "+x.lm.l.t) : null,
        h("div",{style:Object.assign({fontSize:14,fontWeight:700,color:C.ink,lineHeight:1.4,marginTop:2},clamp)}, q?q.prompt:it.p),
        h("div",{style:{fontSize:12,color:x.fixed?C.greenD:C.ink3,fontWeight:700,marginTop:3}}, meta)),
      h("div",{style:{display:"flex",transform:open?"rotate(90deg)":"none",transition:"transform .15s",marginTop:3}}, icon("chevron",16,C.ink3,2)));
    let body=null;
    if(open){
      let pick=null; if(q && q.options && it.a && it.a[0]){ const ix=q.options.findIndex(o=>clip(o.t,400)===it.a[0].x); if(ix>=0) pick=ix; }
      body=h("div",{style:{padding:"0 14px 16px 57px"}},
        q && q.scenario ? h("div",{style:{fontSize:13,color:C.ink2,lineHeight:1.5,background:ac.tint,borderRadius:10,padding:"9px 11px",marginBottom:9}}, q.scenario) : null,
        (it.a&&it.a.length) ? it.a.map((a,j)=>this.ansBox((j?"EARLIER · ":"YOUR ANSWER · ")+fmtD(new Date(a.t)), a.x, false, "a"+j))
          : h("div",{key:"na",style:{fontSize:12.5,color:C.ink3,fontWeight:700,marginBottom:8}}, "Your answer wasn't recorded: this miss predates the mistake log."),
        (!q || !q.options) ? this.ansBox("CORRECT ANSWER", q?this.correctText(q):it.c, true, "c") : null,
        q ? this.renderExplain(q,ac,pick,false,true) : null,
        q ? h("div",{style:{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}},
          this.btn("Practise this", ()=>this.startMistakes([x.id]), {bg:C.card,color:C.goldD,dark:C.line2,border:C.line2,fs:13.5,pad:"8px 14px",upper:false}),
          this.btn("Hide question", ()=>this.setState({hideFor:x.id}), {bg:C.card,color:C.ink3,dark:C.line2,border:C.line2,fs:13.5,pad:"8px 14px",upper:false})) : null);
    }
    return h("div",{key:x.id,style:{borderTop:i?"1px solid "+C.line:"none"}}, head, body);
  }
}

</script>
