name: Build APK
on:
  push:
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licences
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - name: Signing key
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore debug.keystore
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Save APK signing key" && git push origin HEAD:${GITHUB_REF_NAME} || echo "::warning::Couldn't save the signing key to the repository"
          fi
      - run: npm install
      - run: npx cap add android
      - run: npm run icons || echo "::warning::Icon generation failed; the default icon will be used"
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dealcraft-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
